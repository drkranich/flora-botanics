name: CI

on:
  push:
    branches: [main]
  pull_request:

# O deploy é feito automaticamente pela integração nativa do Cloudflare Workers
# (GitHub App → "Construções dos Trabalhadores" visível nos checks do commit).
# Este workflow valida tipos e build em PRs e pushes ao main.

jobs:
  typecheck:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: UI glass guard
        run: pnpm lint:ui

      - name: Build (storefront + admin + packages)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mbpvzhcrimdwcqkqvoqr.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
